<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffc9e3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Sticker Room - unbox cute stickers and decorate cozy 3D rooms. A relaxing physics puzzle." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <title>Sticker Room</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>

    <!-- HUD -->
    <div id="hud" class="layer hidden">
      <div class="top">
        <button id="btn-pause" class="round" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M5 5h5v14H5zM14 5h5v14h-5z" fill="currentColor"/></svg></button>
        <div class="level-pill">
          <div id="lvl-name">Dreamy Bedroom</div>
          <div class="bar"><i id="bar-fill"></i></div>
        </div>
        <div class="coin-pill"><span class="coin"></span><b id="coins">0</b></div>
      </div>
      <div id="toast"></div>
      <div class="bottom">
        <button id="btn-hint" class="chunky yellow"><span class="ico">💡</span> Hint <em id="hint-cost">free</em></button>
      </div>
      <div id="zoom" class="zoom">
        <button id="zoom-in" class="round small" aria-label="Zoom in">＋</button>
        <button id="zoom-out" class="round small" aria-label="Zoom out">－</button>
        <button id="zoom-reset" class="round small dim" aria-label="Reset view">⤢</button>
      </div>
      <div id="zen-bar">
        <button id="zen-photo" class="round small" aria-label="Photo mode">👁</button>
        <button id="zen-clear" class="round small" aria-label="Clear room">🧹</button>
      </div>
      <div id="tray">
        <div class="tray-head"><span>🧺 Sticker tray</span><b id="tray-count">0</b><i class="trash-hint">Drop here to put away</i></div>
        <div id="tray-list"></div>
      </div>
      <div id="hand"></div>
      <div id="floaters"></div>
      <div id="combo"></div>
    </div>

    <!-- MAIN MENU -->
    <div id="menu" class="layer hidden">
      <div class="logo">
        <div class="l1"><span>S</span><span>t</span><span>i</span><span>c</span><span>k</span><span>e</span><span>r</span></div>
        <div class="l2"><span>R</span><span>o</span><span>o</span><span>m</span></div>
        <div class="tag">Unbox · Decorate · Chill</div>
      </div>
      <div class="menu-bottom">
        <button id="btn-play" class="chunky pink big">▶ Play</button>
        <div class="row icon-row">
          <button id="btn-levels" class="chunky mint"><span>🏠</span>Rooms</button>
          <button id="btn-zen" class="chunky green"><span>🌿</span>Zen</button>
          <button id="btn-code" class="chunky yellow"><span>🔑</span>Code</button>
          <button id="btn-settings" class="chunky lav"><span>⚙️</span>Settings</button>
        </div>
      </div>
    </div>

    <!-- LEVEL SELECT -->
    <div id="levels" class="layer hidden">
      <div class="sheet">
        <div class="sheet-head"><h2 id="levels-title">Rooms</h2><button id="levels-close" class="round small" aria-label="Close">✕</button></div>
        <div id="levels-list"></div>
      </div>
    </div>

    <!-- WIN -->
    <div id="win" class="layer hidden">
      <div class="card win-card">
        <div class="ribbon">Room Complete!</div>
        <div id="win-stars" class="stars"><i></i><i></i><i></i></div>
        <div class="win-coins"><span class="coin"></span> <b id="win-coins">+0</b></div>
        <button id="win-code" class="win-code">🔑 Save code <b id="win-code-txt">----</b> <span>copy</span></button>
        <div class="win-btns">
          <button id="btn-next" class="chunky pink big">Next ▶</button>
          <div class="row">
            <button id="btn-replay" class="chunky yellow">↻ Replay</button>
            <button id="btn-win-menu" class="chunky lav">🏠 Menu</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div id="settings" class="layer hidden">
      <div class="card">
        <div class="sheet-head"><h2>Settings</h2><button id="settings-close" class="round small" aria-label="Close">✕</button></div>
        <label class="tog"><span>🔊 Sound effects</span><input type="checkbox" id="set-sound" /><i></i></label>
        <label class="tog"><span>🎵 Music</span><input type="checkbox" id="set-music" /><i></i></label>
        <label class="tog"><span>📳 Vibration</span><input type="checkbox" id="set-haptics" /><i></i></label>
        <label class="tog"><span>🔋 Battery saver (30 fps)</span><input type="checkbox" id="set-saver" /><i></i></label>
        <div class="tog gfx"><span>🎨 Graphics <small id="gfx-note"></small></span>
          <div class="seg" id="set-gfx"><button data-v="auto">Auto</button><button data-v="low">Smooth</button><button data-v="high">Pretty</button></div>
        </div>
        <button id="settings-code" class="chunky yellow wide">🔑 Save / load code</button>
        <button id="btn-reset" class="link">Reset progress</button>
      </div>
    </div>

    <!-- PAUSE -->
    <div id="pause" class="layer hidden">
      <div class="card">
        <h2 id="pause-title">Paused</h2>
        <div class="win-btns">
          <button id="btn-resume" class="chunky pink big">▶ Resume</button>
          <div class="row">
            <button id="btn-restart" class="chunky yellow">↻ Restart</button>
            <button id="btn-quit" class="chunky lav">🏠 Menu</button>
          </div>
          <button id="pause-code" class="link">🔑 My save code</button>
        </div>
      </div>
    </div>

    <!-- SAVE CODE -->
    <div id="code" class="layer hidden">
      <div class="card">
        <div class="sheet-head"><h2>🔑 Save code</h2><button id="code-close" class="round small" aria-label="Close">✕</button></div>
        <p class="code-help">Write this down to continue on any device:</p>
        <div class="code-now" id="code-now">----</div>
        <button id="code-copy" class="chunky mint">📋 Copy</button>
        <div class="code-sep">or continue with a code</div>
        <input id="code-in" class="code-in" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXX" />
        <div id="code-err" class="code-err"></div>
        <button id="code-go" class="chunky pink">Continue ▶</button>
      </div>
    </div>

    <div id="loading" class="layer">
      <div class="loader"><div class="blob"></div><div class="blob b2"></div><div class="blob b3"></div></div>
      <div id="loading-txt">Packing boxes…</div>
    </div>
    <button id="photo-exit" class="round" aria-label="Exit photo mode">👁</button>
    <div id="fade"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
